[project]
name = "cursor-notebook-workspace"
version = "0.1.0"
description = "Minimal Cursor notebook workflow tests."
requires-python = ">=3.12,<3.13"
dependencies = [
  "ipykernel>=7,<8",
  "matplotlib>=3.10,<4",
  "numpy>=2.2,<3",
  "torch>=2.11,<2.12",
]

[dependency-groups]
dev = [
  "jupyter>=1,<2",
  "pytest>=8.4,<10",
  "ruff>=0.14,<1",
]

[project.optional-dependencies]
remote = ["modal>=1,<2"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.uv.sources]
torch = [{ index = "pytorch-cu130", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv]
default-groups = ["dev"]
package = false

