<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">Cursor notebook kernel picker flow</title>
  <desc id="desc">Select the current kernel, choose Select Another Kernel, choose Python Environments, then choose the project virtual environment.</desc>
  <rect width="1200" height="700" rx="24" fill="#20252b"/>
  <rect x="28" y="28" width="1144" height="64" rx="14" fill="#30363d"/>
  <text x="58" y="69" fill="#f1f5f9" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="26" font-weight="700">Cursor notebook toolbar</text>
  <rect x="820" y="43" width="320" height="38" rx="9" fill="#4a5561"/>
  <text x="842" y="69" fill="#f8fafc" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="17">ML Lab (.venv)  Python 3.12</text>
  <text x="60" y="145" fill="#94a3b8" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="21">Click the current kernel button (initially it says “Select Kernel”)</text>
  <path d="M600 174v38" stroke="#60a5fa" stroke-width="5"/>
  <path d="m588 202 12 14 12-14" fill="none" stroke="#60a5fa" stroke-width="5"/>
  <rect x="170" y="232" width="860" height="92" rx="14" fill="#343b44" stroke="#60a5fa" stroke-width="3"/>
  <text x="600" y="289" text-anchor="middle" fill="#f8fafc" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="30" font-weight="700">Select Another Kernel...</text>
  <path d="M600 336v38" stroke="#60a5fa" stroke-width="5"/>
  <path d="m588 364 12 14 12-14" fill="none" stroke="#60a5fa" stroke-width="5"/>
  <rect x="170" y="394" width="860" height="92" rx="14" fill="#343b44" stroke="#60a5fa" stroke-width="3"/>
  <text x="600" y="451" text-anchor="middle" fill="#f8fafc" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="30" font-weight="700">Python Environments...</text>
  <path d="M600 498v38" stroke="#60a5fa" stroke-width="5"/>
  <path d="m588 526 12 14 12-14" fill="none" stroke="#60a5fa" stroke-width="5"/>
  <rect x="170" y="556" width="860" height="92" rx="14" fill="#343b44" stroke="#34d399" stroke-width="3"/>
  <text x="600" y="596" text-anchor="middle" fill="#f8fafc" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="24" font-weight="700">workspace environment</text>
  <text x="600" y="625" text-anchor="middle" fill="#a7f3d0" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="20">.venv/bin/python</text>
</svg>
